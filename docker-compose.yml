services:
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:latest
    platform: linux/amd64
    ports:
      - "8080:8080"
      - "5001:5001"
    environment:
      SQLD_NODE: primary
    env_file:
      - ./docker/libsql/server.env
    volumes:
      - ./docker/libsql/data:/var/lib/sqld
    restart: unless-stopped

  libsql-test:
    image: ghcr.io/tursodatabase/libsql-server:latest
    platform: linux/amd64
    ports:
      - "8081:8080"
    environment:
      SQLD_NODE: primary
