name: Deploy (prod)

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      drizzle: ${{ steps.filter.outputs.drizzle }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            drizzle:
              - 'drizzle/**'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun x tsc --noEmit
      - run: bun run build
        env:
          TURSO_DATABASE_URL: http://127.0.0.1:8080

  migrate:
    needs: ci
    if: ${{ needs.ci.outputs.drizzle == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

  deploy:
    needs: [ci, migrate]
    if: ${{ always() && needs.ci.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun x vercel@54 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: bun x vercel@54 build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: bun x vercel@54 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
